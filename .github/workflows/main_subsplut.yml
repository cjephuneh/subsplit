# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - subsplut

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: subsplit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d subsplit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/subsplit_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run prisma:generate
          npm run prisma:deploy
          npm run build
          npm run test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Prisma migrate deploy (Azure production DB)
        env:
          DATABASE_URL: ${{ secrets.AZURE_POSTGRES_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice title=Prisma::Add repo secret AZURE_POSTGRES_DATABASE_URL to apply migrations to Azure Postgres on each deploy. Until then, run locally: DATABASE_URL=... npm run prisma:deploy"
            exit 0
          fi
          npm run prisma:deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0EA2018547C04FC1BFD13870BE29C183 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9867A64A30014BDEA949E4E0DB102FA5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AEAD3B25DDC4A3A9ABD7E8829AB29DF }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'subsplut'
          slot-name: 'Production'
          package: .
          